<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0F6E5C" />
    <meta name="description" content="LeadEra — CRM inmobiliario" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="LeadEra" />

    <title>LeadEra</title>

    <!-- Tema oscuro sin flash: pone la clase antes de que pinte React. Después
         lo maneja src/hooks/useTema.ts, que tiene la misma lista de rutas
         públicas y la misma exclusión de /admin: si cambia una, cambiar la
         otra. "/" tampoco se toca: sin sesión redirige al login sin pasar por
         la app. -->
    <script>
      (function () {
        try {
          var ruta = location.pathname;
          if (ruta === '/' || /^\/(login|signup|recuperar-contrasena|reset-password|c\/[^/]+)\/?$/.test(ruta)) return;
          if (/^\/admin(\/|$)/.test(ruta)) return;
          var tema = null;
          try {
            tema = localStorage.getItem('leadera-tema');
          } catch (e) {}
          var oscuro =
            tema === 'oscuro' ||
            (tema !== 'claro' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (oscuro) document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
